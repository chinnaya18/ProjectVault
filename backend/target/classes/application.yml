spring:
  application:
    name: projectvault-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

projectvault:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:d:/projectvault/storage/projects}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 30000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
